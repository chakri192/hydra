<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#5fd0de"/></marker>
    <marker id="s" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M8,0 L0.5,3 L8,6 z" fill="#5fd0de"/></marker>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f9fd6"/>
      <stop offset="100%" stop-color="#1e5f8a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="480" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="479" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">IT MEASURES AIR, NOT WATER</text>

  <!-- ── the tank ── -->
  <g>
    <!-- sensor module -->
    <rect x="146" y="86" width="86" height="20" rx="3" fill="#182029" stroke="#5fd0de" stroke-width="1.2"/>
    <circle cx="164" cy="96" r="6" fill="none" stroke="#5fd0de" stroke-width="1"/>
    <circle cx="214" cy="96" r="6" fill="none" stroke="#5fd0de" stroke-width="1"/>
    <text x="189" y="80" font-size="9.5" font-weight="700" fill="#5fd0de" text-anchor="middle">HC-SR04</text>

    <!-- tank walls -->
    <path d="M112 112 V 370 H 266 V 112" fill="none" stroke="#39414f" stroke-width="2"/>

    <!-- water -->
    <rect x="114" y="248" width="150" height="121" fill="url(#water)" opacity="0.75"/>
    <path d="M114 248 q 18 -6 37 0 t 37 0 t 37 0 t 39 0" fill="none" stroke="#7fc8f0" stroke-width="1.6"/>

    <!-- ping down and back -->
    <line x1="178" y1="110" x2="178" y2="242" stroke="#5fd0de" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ac)"/>
    <line x1="200" y1="242" x2="200" y2="110" stroke="#5fd0de" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ac)"/>
    <text x="252" y="186" font-size="10.5" font-weight="700" fill="#5fd0de" text-anchor="middle">d</text>

    <!-- scale markers -->
    <line x1="266" y1="118" x2="300" y2="118" stroke="#39414f" stroke-dasharray="2 2"/>
    <text x="306" y="122" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7ddc8b">d = 2 cm → 100%</text>

    <line x1="266" y1="364" x2="300" y2="364" stroke="#39414f" stroke-dasharray="2 2"/>
    <text x="306" y="368" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">d = 30 cm → 0%</text>

    <line x1="266" y1="248" x2="300" y2="248" stroke="#5fd0de" stroke-dasharray="2 2"/>
    <text x="306" y="252" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5fd0de">the reading</text>

    <!-- MQ-4 -->
    <rect x="122" y="140" width="34" height="22" rx="3" fill="#182029" stroke="#f0b866" stroke-width="1.1"/>
    <text x="139" y="155" font-size="8" font-weight="700" fill="#f0b866" text-anchor="middle">MQ-4</text>
    <text x="122" y="176" font-size="9" fill="#f0b866">CH₄ in the headspace</text>

    <text x="189" y="398" font-size="10" fill="#8a9bb4" text-anchor="middle">the sensor never touches the water —</text>
    <text x="189" y="412" font-size="10" fill="#8a9bb4" text-anchor="middle">it times an echo off the surface</text>
  </g>

  <!-- ── level maths ── -->
  <rect x="28" y="428" width="392" height="34" rx="6" fill="#12151b" stroke="#39414f"/>
  <text x="224" y="443" font-size="10" font-family="SFMono-Regular,Menlo,monospace" fill="#7ddc8b" text-anchor="middle">pct = map(d, 30, 2, 0, 100)   — inverted, because closer means fuller</text>
  <text x="224" y="456" font-size="9" fill="#7d8899" text-anchor="middle">median of 3 pings, 4 ms apart, so one stray echo can't spike the reading</text>

  <!-- divider -->
  <line x1="448" y1="56" x2="448" y2="462" stroke="#2b313d"/>

  <!-- ── alerting ── -->
  <text x="476" y="76" font-size="12" font-weight="700" fill="#8a9bb4" letter-spacing="1.1">WHEN THE BUZZER SOUNDS</text>

  <rect x="476" y="92" width="376" height="86" rx="8" fill="#12151b" stroke="#5fd0de" stroke-width="1.2"/>
  <text x="492" y="112" font-size="10.5" font-weight="700" fill="#5fd0de">water level</text>
  <text x="492" y="132" font-size="10" fill="#8a9bb4">on at <tspan font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">80%</tspan>, off again only below <tspan font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">75%</tspan></text>
  <text x="492" y="150" font-size="10" fill="#8a9bb4">Without that 5-point gap a chamber sitting exactly at</text>
  <text x="492" y="164" font-size="10" fill="#8a9bb4">threshold stutters the buzzer on every ripple.</text>

  <rect x="476" y="190" width="376" height="86" rx="8" fill="#12151b" stroke="#f0b866" stroke-width="1.2"/>
  <text x="492" y="210" font-size="10.5" font-weight="700" fill="#f0b866">methane</text>
  <text x="492" y="230" font-size="10" fill="#8a9bb4">on at <tspan font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">1000 ppm</tspan>, off below <tspan font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">900</tspan>. Same idea.</text>
  <text x="492" y="248" font-size="10" fill="#8a9bb4">ppm comes off the MQ-4 datasheet's log-log curve:</text>
  <text x="492" y="264" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7ddc8b">ppm = 1012.7 · (Rs/Ro)^-2.786</text>

  <rect x="476" y="288" width="376" height="98" rx="8" fill="#12151b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="492" y="308" font-size="10.5" font-weight="700" fill="#a78bfa">and the level threshold moves with the forecast</text>
  <text x="492" y="328" font-size="10" fill="#8a9bb4">The dashboard pulls a Bengaluru forecast and scans the next</text>
  <text x="492" y="342" font-size="10" fill="#8a9bb4">four 3-hour blocks. If rain or thunderstorms are coming, the</text>
  <text x="492" y="356" font-size="10" fill="#8a9bb4">alert level drops so a chamber that is merely full now gets</text>
  <text x="492" y="370" font-size="10" fill="#8a9bb4">flagged before the runoff arrives, not after.</text>

  <rect x="476" y="398" width="376" height="64" rx="8" fill="#0f1319" stroke="#39414f" stroke-width="1.2"/>
  <text x="492" y="418" font-size="10.5" font-weight="700" fill="#e6edf3">served straight off the ESP8266</text>
  <g font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">
    <text x="492" y="436">GET /        the whole dashboard, out of PROGMEM</text>
    <text x="492" y="452">GET /level   ·   GET /gas      polled by the page</text>
  </g>
</svg>
